name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install lxml openpyxl
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python scripts/test_decision_provider.py
      - run: python scripts/test_audit_harness.py
      - run: python scripts/audit_harness.py --format markdown
      - run: python scripts/test_xquery_result.py
      - run: python scripts/test_task_runner.py
        env:
          REQUIRE_RUNNER_SANDBOX: "1"
      - run: python -m unittest discover -s examples/ai-assisted-testing -p test_demo.py -v
      - run: python scripts/test_setup_ai_testing.py
      - run: python scripts/test_package_plugin.py
      - run: python scripts/test_build_feature_index.py
      - run: python scripts/test_feature_map_render.py
      - run: python scripts/test_three_view_understanding.py
      - run: python scripts/test_verification_brief.py
      - run: python scripts/test_functional_test_excel.py
      - run: python scripts/test_evidence_catalog.py
      - run: python scripts/setup-ai-testing.py --dry-run --with-xquery
      - run: python scripts/validate_repository.py
      - run: python scripts/package_plugin.py

  installer-windows-dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - shell: pwsh
        run: ./scripts/setup-ai-testing.ps1 -DryRun
      - run: python scripts/test_setup_ai_testing.py
      - run: python scripts/test_package_plugin.py
      - run: python scripts/test_audit_harness.py
      - run: python scripts/test_evidence_catalog.py

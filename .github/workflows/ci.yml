name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check lxml
      - run: python scripts/validate_repository.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: LTS
      - run: dotnet tool restore
      - run: dotnet tool list --local

name: Bug report
description: Report a reproducible defect in the plugin, hooks, schema, or renderer.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and customer data before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the exact behavior and error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Codex/host, Python, .NET, browser, and relevant optional integrations.
